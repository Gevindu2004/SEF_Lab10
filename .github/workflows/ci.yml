name: CampusEats CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/**", "chore/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-ci:
    name: Frontend Build & Verification (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: campuseat-dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: campuseat-dashboard
        run: npm ci

      - name: Build Frontend for Production
        working-directory: campuseat-dashboard
        run: npm run build

  backend-ci:
    name: Backend Build & Verification (ASP.NET Core 8.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore CampusEats.Api/CampusEats.Api.csproj

      - name: Build Backend (Release Mode)
        run: dotnet build CampusEats.Api/CampusEats.Api.csproj --configuration Release --no-restore
